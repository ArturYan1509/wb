<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#cb11ab">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WB Finder">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>WB Finder</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,#0f0c29,#302b63,#24243e);
    min-height:100vh;color:#fff;
    padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 16px);
    overflow-x:hidden;
  }
  .container{max-width:600px;margin:0 auto}
  h1{
    text-align:center;font-size:30px;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(90deg,#cb11ab,#7b2ff7,#f107a3);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    margin-bottom:6px;
  }
  .subtitle{text-align:center;color:#7a7a8c;font-size:12px;margin-bottom:22px}
  .search-box{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
  input{
    width:100%;padding:16px 18px;font-size:16px;
    border:2px solid rgba(255,255,255,.1);border-radius:14px;
    background:rgba(255,255,255,.05);color:#fff;outline:none;
    transition:.25s;
  }
  input:focus{border-color:#cb11ab;background:rgba(255,255,255,.08);box-shadow:0 0 24px rgba(203,17,171,.3)}
  input::placeholder{color:#666}
  button{
    width:100%;padding:16px;font-size:16px;font-weight:700;
    border:none;border-radius:14px;color:#fff;cursor:pointer;
    background:linear-gradient(90deg,#cb11ab,#7b2ff7);
    transition:.25s;
  }
  button:active{transform:scale(.98)}
  button:disabled{opacity:.5}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;justify-content:center}
  .chip{
    padding:8px 14px;font-size:13px;border-radius:20px;
    background:rgba(255,255,255,.06);color:#bbb;
    border:1px solid rgba(255,255,255,.08);cursor:pointer;
    transition:.2s;
  }
  .chip:active{background:rgba(203,17,171,.3);color:#fff}
  .results{display:flex;flex-direction:column;gap:12px}
  .card{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    border-radius:16px;padding:16px;
    transition:.25s;
  }
  .card.top{border-color:#00e676;background:rgba(0,230,118,.07);box-shadow:0 0 24px rgba(0,230,118,.15)}
  .card-name{font-size:14px;font-weight:600;line-height:1.35;margin-bottom:8px}
  .card-meta{font-size:11px;color:#888;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .card-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .price{font-size:22px;font-weight:800;color:#00e676}
  .article{font-size:10px;color:#666;font-family:monospace;margin-top:2px}
  .buy{
    padding:10px 18px;font-size:13px;font-weight:700;
    background:linear-gradient(90deg,#cb11ab,#7b2ff7);
    color:#fff;text-decoration:none;border-radius:10px;white-space:nowrap;
  }
  .buy:active{transform:scale(.96)}
  .loader{text-align:center;padding:50px 0;display:none}
  .loader.active{display:block}
  .spinner{
    width:44px;height:44px;margin:0 auto 16px;
    border:3px solid rgba(255,255,255,.1);border-top-color:#cb11ab;
    border-radius:50%;animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty{text-align:center;padding:50px 20px;color:#666;font-size:14px;display:none}
  .empty.active{display:block}
</style>
</head>
<body>
<div class="container">
  <h1>WB Finder</h1>
  <p class="subtitle">Самые дешёвые товары Wildberries</p>

  <div class="search-box">
    <input id="query" type="text" placeholder="Что искать? наушники, iphone 15..." autocomplete="off" enterkeyhint="search">
    <button id="searchBtn">🔍 Найти дешёвое</button>
  </div>

  <div class="chips">
    <div class="chip" data-q="наушники">наушники</div>
    <div class="chip" data-q="чехол iphone">чехол</div>
    <div class="chip" data-q="футболка">футболка</div>
    <div class="chip" data-q="powerbank">powerbank</div>
  </div>

  <div class="loader" id="loader"><div class="spinner"></div><div style="color:#888;font-size:13px">Ищу дешёвые варианты...</div></div>
  <div class="results" id="results"></div>
  <div class="empty" id="empty"></div>
</div>

<script>
const input = document.getElementById("query");
const btn = document.getElementById("searchBtn");
const results = document.getElementById("results");
const loader = document.getElementById("loader");
const empty = document.getElementById("empty");

document.querySelectorAll(".chip").forEach(c => {
  c.addEventListener("click", () => { input.value = c.dataset.q; search(); });
});

input.addEventListener("keydown", e => { if (e.key === "Enter") search(); });
btn.addEventListener("click", search);

async function search() {
  const q = input.value.trim();
  if (!q) return;

  results.innerHTML = "";
  empty.classList.remove("active");
  loader.classList.add("active");
  btn.disabled = true;

  const wbUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://search.wb.ru/exactmatch/ru/common/v9/search?appType=1&curr=rub&dest=-1257786&query=${encodeURIComponent(q)}&resultset=catalog&sort=price_up&spp=30&suppressSpellcheck=false`)}`;

  try {
    const res = await fetch(wbUrl);
    const raw = await res.json();

    const items = (raw.products || []).map(p => {
      let price = 0;
      try { price = p.sizes[0].price.product / 100; } catch(e) {}
      return {
        name: p.name || "—",
        brand: p.brand || "—",
        price: price,
        rating: p.reviewRating || 0,
        feedbacks: p.feedbacks || 0,
        supplier: p.supplier || "—",
        id: p.id
      };
    }).filter(i => i.price > 0).sort((a,b) => a.price - b.price).slice(0, 50);

    loader.classList.remove("active");
    btn.disabled = false;

    if (!items.length) {
      empty.textContent = "😔 Ничего не найдено";
      empty.classList.add("active");
      return;
    }

    localStorage.setItem("lastSearch", JSON.stringify({q, items, time: Date.now()}));

    items.forEach((item, i) => {
      const stars = item.rating >= 4.5 ? "★★★★★" : item.rating >= 4 ? "★★★★" : item.rating >= 3 ? "★★★" : "★★";
      const card = document.createElement("div");
      card.className = "card" + (i === 0 ? " top" : "");
      card.innerHTML = `
        <div class="card-name">${i === 0 ? "🏆 " : ""}${esc(item.name)}</div>
        <div class="card-meta">
          <span>🏷 ${esc(item.brand)}</span>
          <span>${stars} ${item.rating}</span>
          <span>💬 ${item.feedbacks}</span>
          <span>🏪 ${esc(item.supplier)}</span>
        </div>
        <div class="card-bottom">
          <div>
            <div class="price">${item.price.toLocaleString("ru")} ₽</div>
            <div class="article">арт. ${item.id}</div>
          </div>
          <a class="buy" href="https://www.wildberries.ru/catalog/${item.id}/detail.aspx" target="_blank">Купить</a>
        </div>`;
      results.appendChild(card);
    });
  } catch (e) {
    loader.classList.remove("active");
    btn.disabled = false;

    const cached = localStorage.getItem("lastSearch");
    if (cached) {
      const {q, items} = JSON.parse(cached);
      empty.textContent = `📴 Нет сети. Последний поиск: "${q}"`;
      empty.classList.add("active");
      items.forEach((item, i) => {
        const card = document.createElement("div");
        card.className = "card" + (i === 0 ? " top" : "");
        card.innerHTML = `
          <div class="card-name">${i === 0 ? "🏆 " : ""}${esc(item.name)}</div>
          <div class="card-bottom">
            <div>
              <div class="price">${item.price.toLocaleString("ru")} ₽</div>
              <div class="article">арт. ${item.id}</div>
            </div>
            <a class="buy" href="https://www.wildberries.ru/catalog/${item.id}/detail.aspx" target="_blank">Купить</a>
          </div>`;
        results.appendChild(card);
      });
    } else {
      empty.textContent = "❌ Ошибка: " + e.message;
      empty.classList.add("active");
    }
  }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
